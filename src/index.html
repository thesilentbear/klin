<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" />
  <title>Klin</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <span class="logo"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 2c1.1 6.6 3.2 8.7 10 9.8-6.8 1.1-8.9 3.2-10 9.8-1.1-6.6-3.2-8.7-10-9.8C8.8 10.7 10.9 8.6 12 2z"/></svg></span>
          <span>Klin</span>
        </div>
        <button id="btn-new" class="btn-primary" title="New chat"><span class="plus-ico">+</span>New chat</button>
      </div>
      <div id="session-list"></div>
    </aside>

    <main>
      <header id="topbar">
        <button id="btn-menu" class="ghost" title="Toggle sidebar"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="conn" id="conn-status"><span class="dot"></span><span id="conn-text">checking…</span></div>
        <div id="model-name" class="model-name">…</div>
        <span id="ctx-meter" class="ctx-meter" title="Context usage" hidden>0 tok</span>
      </header>

      <div id="messages"><div id="empty-state">
        <div class="empty-logo">✳</div>
        <h1>Ask anything</h1>
        <p>Any question — I search the web when I need to verify or stay current.</p>
      </div></div>

      <footer id="composer-wrap">
        <div id="attachments"></div>
        <div id="tool-bar"></div>
        <div class="composer-row">
          <button class="btn-settings" id="btn-settings" title="Settings"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
          <div class="composer">
            <button class="btn-attach" id="btn-attach" title="Add image">＋</button>
            <textarea id="input" rows="1" placeholder="Message… (Ctrl+V to paste an image, Enter to send, Shift+Enter newline)"></textarea>
            <button id="btn-send" title="Send"><span class="send-ico">➤</span></button>
          </div>
          <input type="file" id="file-input" accept="image/*" multiple hidden />
        </div>
      </footer>
    </main>
  </div>

  <div id="settings-modal" class="modal" hidden>
    <div class="modal-card">
      <h2>Settings</h2>
      <label>llama.cpp URL
        <input type="text" id="set-llama" />
      </label>
      <label>Provider
        <select id="set-provider">
          <option value="auto">Auto (local llama.cpp, fallback to OpenCode Zen)</option>
          <option value="local">Local llama.cpp only</option>
          <option value="zen">OpenCode Zen (free cloud models)</option>
        </select>
      </label>
      <label>Model
        <select id="set-model"></select>
      </label>
      <label>Zen API key (empty = free tier)
        <input type="password" id="set-zenkey" placeholder="sk-…" autocomplete="off" />
      </label>
      <label>SearXNG URL
        <input type="text" id="set-searxng" />
      </label>
      <label>Temperature
        <input type="number" id="set-temp" step="0.1" min="0" max="2" />
      </label>
      <label>Compaction — nudge at (%)
        <input type="number" id="set-nudge" step="5" min="30" max="95" />
      </label>
      <label>Compaction — auto at (%)
        <input type="number" id="set-auto" step="5" min="30" max="99" />
      </label>
      <label>Web research results
        <input type="number" id="set-results" min="1" max="10" />
      </label>
      <label>Search backend
        <select id="set-backend">
          <option value="ddg">DuckDuckGo (standalone, no Docker)</option>
          <option value="searxng">SearXNG (self-hosted, Docker)</option>
        </select>
      </label>
      <div class="modal-actions">
        <button class="btn-primary" id="btn-settings-save">Save</button>
        <button class="btn-ghost" id="btn-settings-close">Close</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
